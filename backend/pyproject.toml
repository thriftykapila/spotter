[project]
name = "spotter-api"
version = "0.1.0"
description = "Arrival-time weather assessment for truck routes"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2.17,<5.3",
  "djangorestframework>=3.16,<4",
  "httpx>=0.28,<1",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "timezonefinder>=8,<10",
  "upstash-redis>=1.4,<2",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "hypothesis>=6.130,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.vercel]
entrypoint = "config.wsgi:application"
